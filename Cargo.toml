[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
prost-types = "0.13"
serde = { version= "1.0.163", features = ["derive"]}
serde_json = "1.0.108"
validator = { version = "0.16", features = ["derive"] }
thiserror = { version = "1.0.40" }
anyhow = { version = "1.0.86" }
bytes = "1.6.1"
tokio = { version = "1.14.1", features = ["full"] }
axum = { version = "0.7.2", features = ['default', 'macros'] }
tonic = "0.12.2"


# solana
solana-sdk = "1.18.14"
solana-client = "1.18.14"


[build-dependencies]
tonic-build = "0.12.2"